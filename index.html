<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PokéTibia Idle MMORPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0f12; color: #fff; }
        
        /* Contenedor del Juego */
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; background: #2d5a27; }

        /* UI SUPERIOR - BARRA DE HERRAMIENTAS */
        .top-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 22, 28, 0.9); border: 1px solid #3a4756; border-radius: 8px;
            display: flex; gap: 8px; padding: 6px 12px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .icon-btn { width: 32px; height: 32px; background: #252e3d; border: 1px solid #48586e; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; }
        .icon-btn:hover { background: #3b495e; }
        .auto-btn { background: #1e3a5f; color: #60a5fa; border: 1px solid #3b82f6; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .auto-btn.active { background: #166534; color: #4ade80; border-color: #22c55e; }

        /* PANEL IZQUIERDO - EQUIPO POKÉMON */
        .left-panel {
            position: absolute; top: 10px; left: 10px; width: 220px;
            background: rgba(15, 20, 25, 0.92); border: 1px solid #2d3748; border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
        }
        .player-info { border-bottom: 1px solid #2d3748; padding-bottom: 6px; margin-bottom: 4px; }
        .player-name { font-size: 14px; font-weight: bold; color: #e2e8f0; }
        .player-sub { font-size: 11px; color: #a0aec0; }

        .poke-card { background: #1a202c; border: 1px solid #2d3748; border-radius: 6px; padding: 6px; display: flex; gap: 8px; align-items: center; }
        .poke-avatar { width: 36px; height: 36px; background: #2d3748; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 1px solid #4a5568; }
        .poke-details { flex: 1; }
        .poke-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 3px; }
        .bar-bg { width: 100%; height: 6px; background: #1a202c; border-radius: 3px; overflow: hidden; margin-bottom: 3px; border: 1px solid #2d3748; }
        .bar-fill-hp { height: 100%; background: #22c55e; width: 100%; transition: width 0.2s; }
        .bar-fill-exp { height: 100%; background: #3b82f6; width: 0%; transition: width 0.2s; }

        /* PANEL DERECHO INFERIOR - CAPTURA */
        .right-panel {
            position: absolute; bottom: 10px; right: 10px; width: 220px;
            background: rgba(15, 20, 25, 0.92); border: 1px solid #2d3748; border-radius: 8px; padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
        }
        .panel-title { font-size: 12px; font-weight: bold; color: #f6ad55; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .capture-item { display: flex; justify-content: space-between; align-items: center; background: #1a202c; padding: 6px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
        .btn-action { background: #3182ce; border: none; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-action:hover { background: #2b6cb0; }

        /* CONTROLES MÓVILES (D-PAD) */
        .dpad { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; z-index: 10; display: none; }
        .dpad-btn { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: white; }
        .dpad-up { top: 0; left: 40px; }
        .dpad-down { bottom: 0; left: 40px; }
        .dpad-left { top: 40px; left: 0; }
        .dpad-right { top: 40px; right: 0; }

        @media (max-width: 768px) {
            .dpad { display: block; }
            .left-panel { width: 170px; font-size: 10px; }
            .right-panel { width: 170px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- Barra Superior estilo MMORPG -->
        <div class="top-bar">
            <div class="icon-btn" title="Mochila">🎒</div>
            <div class="icon-btn" title="Mapas">🗺️</div>
            <div class="icon-btn" title="Pokéballs">⚽</div>
            <div class="icon-btn" title="Tienda">🏬</div>
            <button class="auto-btn active" id="autoBtn" onclick="toggleAuto()">⚙️ Auto-Helper: ON</button>
        </div>

        <!-- Panel Izquierdo: Datos del Jugador y Equipo Pokémon -->
        <div class="left-panel">
            <div class="player-info">
                <div class="player-name">Chuo02</div>
                <div class="player-sub">Nivel 85 • Entrenador</div>
            </div>
            
            <div class="poke-card">
                <div class="poke-avatar">🪨</div>
                <div class="poke-details">
                    <div class="poke-header"><span>GRAVELER</span> <span>Nv. 81</span></div>
                    <div class="bar-bg"><div class="bar-fill-hp" id="hp-graveler" style="width: 100%;"></div></div>
                    <div class="bar-bg"><div class="bar-fill-exp" id="exp-graveler" style="width: 45%;"></div></div>
                </div>
            </div>

            <div class="poke-card">
                <div class="poke-avatar">🔥</div>
                <div class="poke-details">
                    <div class="poke-header"><span>CHARMANDER</span> <span>Nv. 11</span></div>
                    <div class="bar-bg"><div class="bar-fill-hp" style="width: 100%;"></div></div>
                    <div class="bar-bg"><div class="bar-fill-exp" style="width: 80%;"></div></div>
                </div>
            </div>

            <div class="poke-card">
                <div class="poke-avatar">🐱</div>
                <div class="poke-details">
                    <div class="poke-header"><span>MEOWTH</span> <span>Nv. 25</span></div>
                    <div class="bar-bg"><div class="bar-fill-hp" style="width: 100%;"></div></div>
                    <div class="bar-bg"><div class="bar-fill-exp" style="width: 20%;"></div></div>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Captura de Salvajes -->
        <div class="right-panel">
            <div class="panel-title">🎯 CAPTURA <span>⚽ 53</span></div>
            <div id="captureList">
                <!-- Se poblará dinámicamente con los salvajes cercanos -->
            </div>
        </div>

        <!-- D-Pad para Dispositivos Móviles -->
        <div class="dpad">
            <div class="dpad-btn dpad-up" onclick="movePlayer(0, -1)">▲</div>
            <div class="dpad-btn dpad-down" onclick="movePlayer(0, 1)">▼</div>
            <div class="dpad-btn dpad-left" onclick="movePlayer(-1, 0)">◄</div>
            <div class="dpad-btn dpad-right" onclick="movePlayer(1, 0)">►</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configuración de pantalla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Variables Globales de Juego
        const TILE_SIZE = 48;
        let autoHelper = true;

        // Entrenador (Jugador)
        const player = {
            x: 10, y: 10,
            targetX: 10, targetY: 10,
            pixelX: 10 * TILE_SIZE, pixelY: 10 * TILE_SIZE,
            speed: 3,
            name: "Chuo02",
            sprite: "🏃"
        };

        // Mi Pokémon activo (Acompañante)
        const pet = {
            x: 9, y: 10,
            pixelX: 9 * TILE_SIZE, pixelY: 10 * TILE_SIZE,
            name: "Graveler",
            emoji: "🪨",
            target: null
        };

        // Arreglo de Pokémon Salvajes
        let wildPokemons = [
            { id: 1, name: "Meowth", level: 20, emoji: "🐱", x: 14, y: 8, pixelX: 14*48, pixelY: 8*48, hp: 100, maxHp: 100, dirX: 1, dirY: 0 },
            { id: 2, name: "Meowth", level: 22, emoji: "🐱", x: 6, y: 14, pixelX: 6*48, pixelY: 14*48, hp: 100, maxHp: 100, dirX: 0, dirY: 1 },
            { id: 3, name: "Pidgey", level: 15, emoji: "🐦", x: 16, y: 12, pixelX: 16*48, pixelY: 12*48, hp: 80, maxHp: 80, dirX: -1, dirY: 0 },
            { id: 4, name: "Oddish", level: 12, emoji: "🌱", x: 8, y: 6, pixelX: 8*48, pixelY: 6*48, hp: 70, maxHp: 70, dirX: 0, dirY: -1 }
        ];

        // Partículas de Ataques y Texto FLotante
        let effects = [];

        // Generador de Mapa de Azulejos (Grass, Water, Mountain, Trees)
        const MAP_SIZE = 30;
        const mapGrid = [];
        for (let r = 0; r < MAP_SIZE; r++) {
            mapGrid[r] = [];
            for (let c = 0; c < MAP_SIZE; c++) {
                if (c === 0 || r === 0 || c === MAP_SIZE - 1 || r === MAP_SIZE - 1) mapGrid[r][c] = "stone";
                else if ((c === 5 || c === 6) && r < 12) mapGrid[r][c] = "stone"; // Montaña rocosa
                else if (Math.random() < 0.12) mapGrid[r][c] = "tree"; // Árboles dispersos
                else mapGrid[r][c] = "grass";
            }
        }

        // Bucle Principal de Renderizado y Física
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Lógica de Movimiento y Combate
        function update() {
            // Suavizado de movimiento del Jugador
            let targetPixelX = player.x * TILE_SIZE;
            let targetPixelY = player.y * TILE_SIZE;

            player.pixelX += (targetPixelX - player.pixelX) * 0.15;
            player.pixelY += (targetPixelY - player.pixelY) * 0.15;

            // Seguir al jugador con la mascota Pokémon
            let petTargetX = (player.x - 1) * TILE_SIZE;
            let petTargetY = player.y * TILE_SIZE;
            pet.pixelX += (petTargetX - pet.pixelX) * 0.1;
            pet.pixelY += (petTargetY - pet.pixelY) * 0.1;

            // Movimiento aleatorio para salvajes
            wildPokemons.forEach(mob => {
                if (Math.random() < 0.01) {
                    mob.dirX = Math.floor(Math.random() * 3) - 1;
                    mob.dirY = Math.floor(Math.random() * 3) - 1;
                }
                
                mob.pixelX += mob.dirX * 0.4;
                mob.pixelY += mob.dirY * 0.4;
            });

            // Lógica Auto-Helper (Ataque Automático estilo Idle)
            if (autoHelper && wildPokemons.length > 0) {
                let target = wildPokemons[0]; // Atacar al más cercano
                
                if (Math.random() < 0.05) { // Ratio de ataque
                    target.hp -= 15;
                    
                    // Efecto visual de golpe
                    effects.push({
                        x: target.pixelX + 10,
                        y: target.pixelY - 10,
                        text: "-15",
                        color: "#ef4444",
                        life: 30
                    });

                    // Si muere el objetivo
                    if (target.hp <= 0) {
                        effects.push({
                            x: target.pixelX,
                            y: target.pixelY,
                            text: "¡Derrotado!",
                            color: "#facc15",
                            life: 40
                        });

                        // Reaparecer en otra posición
                        target.hp = target.maxHp;
                        target.pixelX = (Math.floor(Math.random() * 15) + 5) * TILE_SIZE;
                        target.pixelY = (Math.floor(Math.random() * 15) + 5) * TILE_SIZE;
                    }
                }
            }

            // Actualizar partículas
            effects.forEach((eff, index) => {
                eff.y -= 0.5;
                eff.life--;
                if (eff.life <= 0) effects.splice(index, 1);
            });

            updateUI();
        }

        // Dibujar Escena en 2D (Cámara centrada en el jugador)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calcular Offset de Cámara
            let offsetX = canvas.width / 2 - player.pixelX - TILE_SIZE / 2;
            let offsetY = canvas.height / 2 - player.pixelY - TILE_SIZE / 2;

            // 1. Dibujar Terreno (Tiles)
            for (let r = 0; r < MAP_SIZE; r++) {
                for (let c = 0; c < MAP_SIZE; c++) {
                    let drawX = c * TILE_SIZE + offsetX;
                    let drawY = r * TILE_SIZE + offsetY;

                    // Optimización: Solo renderizar lo visible en pantalla
                    if (drawX > -TILE_SIZE && drawX < canvas.width && drawY > -TILE_SIZE && drawY < canvas.height) {
                        if (mapGrid[r][c] === "grass") {
                            ctx.fillStyle = (r + c) % 2 === 0 ? "#22c55e" : "#16a34a";
                            ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
                        } else if (mapGrid[r][c] === "stone") {
                            ctx.fillStyle = "#64748b";
                            ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
                            ctx.strokeStyle = "#475569";
                            ctx.strokeRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
                        } else if (mapGrid[r][c] === "tree") {
                            ctx.fillStyle = "#15803d";
                            ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = "#166534";
                            ctx.beginPath();
                            ctx.arc(drawX + 24, drawY + 24, 20, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }

            // 2. Dibujar Pokémon Salvajes
            wildPokemons.forEach(mob => {
                let drawX = mob.pixelX + offsetX;
                let drawY = mob.pixelY + offsetY;

                // Nombre sobre la cabeza estilo PokéTibia
                ctx.font = "bold 11px Arial";
                ctx.fillStyle = "#4ade80";
                ctx.textAlign = "center";
                ctx.fillText(mob.name, drawX + TILE_SIZE/2, drawY - 8);

                // Barra de Vida
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(drawX + 4, drawY - 5, 40, 4);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(drawX + 4, drawY - 5, (mob.hp / mob.maxHp) * 40, 4);

                // Sprite del Pokémon
                ctx.font = "30px Arial";
                ctx.fillText(mob.emoji, drawX + TILE_SIZE/2, drawY + TILE_SIZE - 8);
            });

            // 3. Dibujar Mascota Pokémon (Graveler)
            let petX = pet.pixelX + offsetX;
            let petY = pet.pixelY + offsetY;
            ctx.font = "bold 11px Arial";
            ctx.fillStyle = "#60a5fa";
            ctx.textAlign = "center";
            ctx.fillText(pet.name, petX + TILE_SIZE/2, petY - 8);
            ctx.font = "30px Arial";
            ctx.fillText(pet.emoji, petX + TILE_SIZE/2, petY + TILE_SIZE - 8);

            // 4. Dibujar Jugador
            let pX = player.pixelX + offsetX;
            let pY = player.pixelY + offsetY;

            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText(player.name, pX + TILE_SIZE/2, pY - 10);

            ctx.font = "32px Arial";
            ctx.fillText(player.sprite, pX + TILE_SIZE/2, pY + TILE_SIZE - 6);

            // 5. Dibujar Efectos y Daño Flotante
            effects.forEach(eff => {
                ctx.font = "bold 14px Arial";
                ctx.fillStyle = eff.color;
                ctx.fillText(eff.text, eff.x + offsetX, eff.y + offsetY);
            });
        }

        // Mover jugador
        function movePlayer(dx, dy) {
            let newX = player.x + dx;
            let newY = player.y + dy;

            if (newX >= 1 && newX < MAP_SIZE - 1 && newY >= 1 && newY < MAP_SIZE - 1) {
                if (mapGrid[newY][newX] !== "stone") {
                    player.x = newX;
                    player.y = newY;
                }
            }
        }

        // Eventos de Teclado (WASD / Flechas)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" || e.key === "w") movePlayer(0, -1);
            if (e.key === "ArrowDown" || e.key === "s") movePlayer(0, 1);
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1, 0);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(1, 0);
        });

        // Click en Pantalla para Moverse
        canvas.addEventListener("click", e => {
            let offsetX = canvas.width / 2 - player.pixelX - TILE_SIZE / 2;
            let offsetY = canvas.height / 2 - player.pixelY - TILE_SIZE / 2;

            let clickGridX = Math.floor((e.clientX - offsetX) / TILE_SIZE);
            let clickGridY = Math.floor((e.clientY - offsetY) / TILE_SIZE);

            if (clickGridX >= 1 && clickGridX < MAP_SIZE - 1 && clickGridY >= 1 && clickGridY < MAP_SIZE - 1) {
                player.x = clickGridX;
                player.y = clickGridY;
            }
        });

        // Activar / Desactivar Auto Helper
        function toggleAuto() {
            autoHelper = !autoHelper;
            const btn = document.getElementById("autoBtn");
            if (autoHelper) {
                btn.classList.add("active");
                btn.innerText = "⚙️ Auto-Helper: ON";
            } else {
                btn.classList.remove("active");
                btn.innerText = "⚙️ Auto-Helper: OFF";
            }
        }

        // Actualizar UI lateral de capturas
        function updateUI() {
            const list = document.getElementById("captureList");
            list.innerHTML = "";
            wildPokemons.slice(0, 3).forEach(mob => {
                list.innerHTML += `
                    <div class="capture-item">
                        <span>${mob.emoji} ${mob.name} (Lv.${mob.level})</span>
                        <button class="btn-action" onclick="catchPokemon(${mob.id})">Lanzar</button>
                    </div>
                `;
            });
        }

        function catchPokemon(id) {
            alert("¡Lanzaste una Pokéball!");
        }

        // Iniciar Juego
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
