    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
        /* Retro Game Boy / Arcade Frame Styling */
        .retro-border {
            border: 4px solid #3b4252;
            box-shadow: inset -4px -4px 0px 0px #1e222a, inset 4px 4px 0px 0px #4c566a, 0 8px 20px rgba(0,0,0,0.6);
            background: #2e3440;
        }
        .retro-box {
            background: #eceff4;
            color: #2e3440;
            border: 4px solid #4c566a;
            box-shadow: inset -3px -3px 0px #d8dee9, inset 3px 3px 0px #fff;
            border-radius: 4px;
        }
        .retro-btn {
            background: #5e81ac;
            color: #eceff4;
            border: 3px solid #2e3440;
            box-shadow: inset -3px -3px 0px #4c566a, inset 3px 3px 0px #81a1c1;
            transition: all 0.1s ease;
        }
        .retro-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: inset -1px -1px 0px #4c566a, inset 1px 1px 0px #81a1c1;
        }
        .retro-btn:disabled {
            background: #4c566a;
            color: #d8dee9;
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Floating Damage Animation */
        @keyframes floatDamage {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-45px) scale(0.8); }
        }
        .damage-popup {
            position: absolute;
            animation: floatDamage 0.8s ease-out forwards;
            font-family: 'Press Start 2P', cursive;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            pointer-events: none;
            z-index: 50;
        }

        /* Sprite Attack & Flash Animations */
        @keyframes attackRight {
            0% { transform: translateX(0); }
            30% { transform: translateX(25px) scale(1.05); }
            100% { transform: translateX(0); }
        }
        @keyframes hurtFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(3) sepia(1) hue-rotate(-50deg) saturate(5); }
        }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-attack { animation: attackRight 0.25s ease-in-out; }
        .animate-hurt { animation: hurtFlash 0.3s ease-in-out; }
        .animate-idle { animation: idleFloat 2.5s ease-in-out infinite; }

        /* Custom Scrollbar for Retro feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2e3440; }
        ::-webkit-scrollbar-thumb { background: #88c0d0; border-radius: 2px; }
    </style>
</head>

    <!-- AUDIO SYNTHESIZER (NO EXTERNAL DEPENDENCIES) -->
    <script>
        // Web Audio API Sound Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 SOUND' : '🔇 MUTED';
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'buy') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(500, now + 0.08);
                osc.frequency.setValueAtTime(750, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'faint') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }
    </script>

    <!-- MAIN GAME ENGINE SCRIPT -->
    <script>
        // --- GAME STATE ---
        let state = {
            gold: 0,
            stage: 1,
            clickPower: 1,
            enemiesDefeated: 0,
            team: {
                pikachu: { name: "Pikachu", level: 0, baseDps: 2, cost: 15, evoLevel: 10, evoName: "Raichu", color: "#facc15", svg: 'electric' },
                charmander: { name: "Charmander", level: 0, baseDps: 8, cost: 100, evoLevel: 15, evoName: "Charmeleon", color: "#f97316", svg: 'fire' },
                bulbasaur: { name: "Bulbasaur", level: 0, baseDps: 30, cost: 600, evoLevel: 15, evoName: "Ivysaur", color: "#22c55e", svg: 'grass' },
                squirtle: { name: "Squirtle", level: 0, baseDps: 120, cost: 3000, evoLevel: 15, evoName: "Wartortle", color: "#3b82f6", svg: 'water' },
                gengar: { name: "Gengar", level: 0, baseDps: 500, cost: 15000, evoLevel: 20, evoName: "Mega Gengar", color: "#a855f7", svg: 'ghost' },
                mewtwo: { name: "Mewtwo", level: 0, baseDps: 2500, cost: 90000, evoLevel: 25, evoName: "Armored Mewtwo", color: "#ec4899", svg: 'psychic' }
            }
        };

        // --- MAPS & ROUTES DATA ---
        const routes = [
            { id: 1, name: "Ruta 1 - Pueblo Paleta", bgTheme: "grass", mobs: [
                { name: "Pidgey", color: "#d97706", type: "bird" },
                { name: "Rattata", color: "#a855f7", type: "rat" },
                { name: "Caterpie", color: "#22c55e", type: "bug" }
            ]},
            { id: 2, name: "Ruta 2 - Bosque Verde", bgTheme: "forest", mobs: [
                { name: "Metapod", color: "#15803d", type: "bug" },
                { name: "Pikachu", color: "#eab308", type: "electric" },
                { name: "Pidgeotto", color: "#b45309", type: "bird" }
            ]},
            { id: 3, name: "Cueva Oscura", bgTheme: "cave", mobs: [
                { name: "Zubat", color: "#6366f1", type: "bat" },
                { name: "Geodude", color: "#78350f", type: "rock" },
                { name: "Onix", color: "#64748b", type: "rock" }
            ]},
            { id: 4, name: "Calle Victoria", bgTheme: "volcano", mobs: [
                { name: "Magmar", color: "#ef4444", type: "fire" },
                { name: "Rhyhorn", color: "#475569", type: "rock" },
                { name: "Charizard", color: "#f97316", type: "fire" }
            ]}
        ];

        let currentEnemy = { name: "Pidgey", hp: 10, maxHp: 10, goldReward: 2, level: 1, color: "#d97706" };

        // --- CANVAS PARALLAX BACKGROUND RENDERER ---
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d");
        let clouds = [ {x: 10, y: 20, speed: 0.2}, {x: 180, y: 35, speed: 0.35}, {x: 300, y: 15, speed: 0.15} ];

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderBackground() {
            const width = canvas.width;
            const height = canvas.height;
            const routeIndex = Math.floor((state.stage - 1) / 5) % routes.length;
            const theme = routes[routeIndex].bgTheme;

            ctx.clearRect(0, 0, width, height);

            if (theme === "grass") {
                // Sky
                let skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.7);
                skyGrad.addColorStop(0, "#38bdf8");
                skyGrad.addColorStop(1, "#bae6fd");
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height * 0.7);

                // Sun
                ctx.fillStyle = "#fef08a";
                ctx.beginPath();
                ctx.arc(width - 50, 40, 24, 0, Math.PI * 2);
                ctx.fill();

                // Animated Clouds
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                clouds.forEach(c => {
                    c.x += c.speed;
                    if (c.x > width + 40) c.x = -50;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
                    ctx.arc(c.x + 12, c.y - 6, 18, 0, Math.PI * 2);
                    ctx.arc(c.x + 28, c.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Mountains
                ctx.fillStyle = "#475569";
                ctx.beginPath();
                ctx.moveTo(0, height * 0.7);
                ctx.lineTo(width * 0.25, height * 0.35);
                ctx.lineTo(width * 0.5, height * 0.7);
                ctx.lineTo(width * 0.8, height * 0.4);
                ctx.lineTo(width, height * 0.7);
                ctx.fill();

                // Ground
                ctx.fillStyle = "#15803d";
                ctx.fillRect(0, height * 0.68, width, height * 0.32);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(0, height * 0.68, width, 8);

            } else if (theme === "forest") {
                // Dark Green Forest Back
                ctx.fillStyle = "#064e3b";
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = "#022c22";
                for (let i = 0; i < width; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, height);
                    ctx.lineTo(i + 20, height * 0.2);
                    ctx.lineTo(i + 40, height);
                    ctx.fill();
                }
                ctx.fillStyle = "#14532d";
                ctx.fillRect(0, height * 0.7, width, height * 0.3);

            } else if (theme === "cave") {
                // Dark Cave
                ctx.fillStyle = "#1e1b4b";
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = "#312e81";
                // Stalactites
                for (let i = 10; i < width; i += 50) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + 15, height * 0.3);
                    ctx.lineTo(i + 30, 0);
                    ctx.fill();
                }
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, height * 0.7, width, height * 0.3);

            } else {
                // Volcano / Victory Road
                ctx.fillStyle = "#450a0a";
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = "#dc2626";
                ctx.fillRect(0, height * 0.75, width, height * 0.25);
                ctx.fillStyle = "#7f1d1d";
                ctx.fillRect(0, height * 0.68, width, height * 0.07);
            }

            requestAnimationFrame(renderBackground);
        }

        // --- POKEMON VECTOR SPRITE GENERATOR ---
        function getPokemonSvg(type, color) {
            return `
            <svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-[0_5px_5px_rgba(0,0,0,0.6)]">
                <!-- Shadow Base -->
                <ellipse cx="32" cy="56" rx="20" ry="5" fill="rgba(0,0,0,0.3)" />
                <!-- Body -->
                <circle cx="32" cy="36" r="18" fill="${color}" />
                <!-- Head/Ears -->
                <circle cx="20" cy="18" r="6" fill="${color}" />
                <circle cx="44" cy="18" r="6" fill="${color}" />
                <!-- Eyes -->
                <circle cx="26" cy="32" r="3" fill="#ffffff" />
                <circle cx="26" cy="32" r="1.5" fill="#000000" />
                <circle cx="38" cy="32" r="3" fill="#ffffff" />
                <circle cx="38" cy="32" r="1.5" fill="#000000" />
                <!-- Cheeks/Details -->
                <circle cx="21" cy="38" r="2.5" fill="#ef4444" opacity="0.8" />
                <circle cx="43" cy="38" r="2.5" fill="#ef4444" opacity="0.8" />
                <!-- Mouth -->
                <path d="M 28 42 Q 32 46 36 42" stroke="#000000" stroke-width="2" fill="none" />
            </svg>`;
        }

        // --- GAME LOGIC & COMBAT SYSTEM ---

        function getDps() {
            let total = 0;
            for (let key in state.team) {
                let p = state.team[key];
                let multiplier = p.level >= p.evoLevel ? 2.5 : 1;
                total += p.level * p.baseDps * multiplier;
            }
            return total;
        }

        function updateEnemy() {
            const routeIndex = Math.floor((state.stage - 1) / 5) % routes.length;
            const currentRoute = routes[routeIndex];
            const randomMob = currentRoute.mobs[Math.floor(Math.random() * currentRoute.mobs.length)];

            // Boss every 5 stages
            const isBoss = state.stage % 5 === 0;
            const hpScale = Math.pow(1.3, state.stage - 1);
            
            currentEnemy.name = (isBoss ? "👑 BOSS " : "") + randomMob.name;
            currentEnemy.level = state.stage;
            currentEnemy.maxHp = Math.round((isBoss ? 25 : 12) * hpScale);
            currentEnemy.hp = currentEnemy.maxHp;
            currentEnemy.goldReward = Math.round((isBoss ? 15 : 5) * state.stage * Math.pow(1.15, state.stage - 1));
            currentEnemy.color = randomMob.color;

            // Update UI elements
            document.getElementById("routeTitle").innerText = currentRoute.name;
            document.getElementById("enemyName").innerText = currentEnemy.name;
            document.getElementById("enemyLevel").innerText = `Lv.${currentEnemy.level}`;
            document.getElementById("enemySprite").innerHTML = getPokemonSvg(randomMob.type, randomMob.color);

            updateHpBar();
        }

        function updateHpBar() {
            const pct = Math.max(0, (currentEnemy.hp / currentEnemy.maxHp) * 100);
            const bar = document.getElementById("enemyHpBar");
            bar.style.width = pct + "%";
            document.getElementById("enemyHpText").innerText = `${Math.ceil(currentEnemy.hp)} / ${currentEnemy.maxHp} HP`;

            // Color status
            if (pct > 50) {
                bar.className = "bg-emerald-500 h-full rounded-full transition-all duration-100";
            } else if (pct > 20) {
                bar.className = "bg-yellow-500 h-full rounded-full transition-all duration-100";
            } else {
                bar.className = "bg-red-500 h-full rounded-full transition-all duration-100";
            }
        }

        function damageEnemy(amount, isClick = false) {
            currentEnemy.hp -= amount;

            // Visual Animations
            const enemySprite = document.getElementById("enemySprite");
            enemySprite.classList.add("animate-hurt");
            setTimeout(() => enemySprite.classList.remove("animate-hurt"), 300);

            if (isClick) {
                const playerSprite = document.getElementById("playerSprite");
                playerSprite.classList.add("animate-attack");
                setTimeout(() => playerSprite.classList.remove("animate-attack"), 250);
                playSound('hit');
            }

            if (currentEnemy.hp <= 0) {
                currentEnemy.hp = 0;
                state.gold += currentEnemy.goldReward;
                state.enemiesDefeated++;
                playSound('faint');
                logMsg(`¡Derrotaste a <span class="text-yellow-600 font-bold">${currentEnemy.name}</span>! Ganaste +¥${currentEnemy.goldReward}`);
                updateEnemy();
            }

            updateHpBar();
            updateUI();
        }

        function handleStageClick(e) {
            // Spawn floating damage text
            const rect = document.getElementById("battleStage").getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const popup = document.createElement("div");
            popup.className = "damage-popup text-yellow-300 text-sm sm:text-base";
            popup.style.left = (x - 10) + "px";
            popup.style.top = (y - 20) + "px";
            popup.innerText = `-${state.clickPower}`;
            document.getElementById("battleStage").appendChild(popup);

            setTimeout(() => popup.remove(), 800);

            damageEnemy(state.clickPower, true);
        }

        function buyPokemon(key) {
            let p = state.team[key];
            if (state.gold >= p.cost) {
                state.gold -= p.cost;
                p.level++;
                p.cost = Math.round(p.cost * 1.25);
                playSound('buy');

                // Evolution check
                if (p.level === p.evoLevel) {
                    logMsg(`🌟 ¡Tu ${p.name} ha evolucionado a <span class="text-purple-600 font-bold">${p.evoName}</span>! Su daño aumentó masivamente.`);
                } else {
                    logMsg(`¡Subiste de nivel a ${p.level >= p.evoLevel ? p.evoName : p.name} (Lv.${p.level})!`);
                }

                updateUI();
                renderShop();
            }
        }

        function changeRoute(delta) {
            state.stage = Math.max(1, state.stage + delta);
            logMsg(` Has viajado a la Ruta / Etapa ${state.stage}`);
            updateEnemy();
            updateUI();
        }

        function logMsg(msg) {
            const log = document.getElementById("gameLog");
            log.innerHTML = `<p class="mb-1 border-b border-slate-300/50 pb-0.5">> ${msg}</p>` + log.innerHTML;
        }

        function renderShop() {
            const container = document.getElementById("shopContainer");
            container.innerHTML = "";

            for (let key in state.team) {
                let p = state.team[key];
                let isEvolved = p.level >= p.evoLevel;
                let displayName = isEvolved ? p.evoName : p.name;
                let currentDps = p.level * p.baseDps * (isEvolved ? 2.5 : 1);
                let canAfford = state.gold >= p.cost;

                container.innerHTML += `
                    <div class="bg-slate-800 border-2 border-slate-600 p-2 rounded flex items-center justify-between gap-2 shadow">
                        <div class="flex items-center gap-2">
                            <div class="w-10 h-10 rounded border border-slate-500 flex items-center justify-center p-1" style="background:${p.color}">
                                ${getPokemonSvg(p.svg, '#ffffff')}
                            </div>
                            <div class="flex flex-col text-xs font-mono">
                                <span class="font-bold ${isEvolved ? 'text-purple-400' : 'text-white'}">${displayName}</span>
                                <span class="text-gray-400">Nivel: ${p.level} ${isEvolved ? '🌟' : ''}</span>
                                <span class="text-red-400">+${currentDps} DPS</span>
                            </div>
                        </div>
                        <button onclick="buyPokemon('${key}')" ${!canAfford ? 'disabled' : ''} class="retro-btn text-[10px] pixel-font py-1.5 px-2">
                            MEJORAR<br><span class="text-yellow-300">¥${p.cost}</span>
                        </button>
                    </div>
                `;
            }
        }

        function updateUI() {
            document.getElementById("gold").innerText = `¥${state.gold}`;
            document.getElementById("dps").innerText = getDps();
            document.getElementById("stage").innerText = state.stage;
            renderShop();
        }

        function resetGame() {
            if (confirm("¿Estás seguro de que deseas reiniciar toda tu partida de Pokémon Idle?")) {
                localStorage.removeItem("jerimbia_pokemon_save");
                location.reload();
            }
        }

        // --- GAME LOOP & SAVING ---

        // Idle Game Loop (10 ticks per second)
        setInterval(() => {
            let dps = getDps();
            if (dps > 0) {
                damageEnemy(dps / 10, false);
            }
        }, 100);

        // Auto Save to LocalStorage
        setInterval(() => {
            localStorage.setItem("jerimbia_pokemon_save", JSON.stringify(state));
            const status = document.getElementById("saveStatus");
            status.style.opacity = '1';
            setTimeout(() => status.style.opacity = '0.3', 1000);
        }, 10000);

        // Load Game on Startup
        window.onload = function() {
            renderBackground();
            const saved = localStorage.getItem("jerimbia_pokemon_save");
            if (saved) {
                try {
                    let loaded = JSON.parse(saved);
                    state = Object.assign({}, state, loaded);
                    logMsg("¡Partida recuperada con éxito!");
                } catch(e) {
                    console.error("Error al cargar la partida", e);
                }
            }
            updateEnemy();
            updateUI();
        };
    </script>
</body>
</html>
